version: '3.8'

services:

  # ── MongoDB ──────────────────────────────────────────────────
  mongo:
    image: mongo:6.0
    container_name: smartflow-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: smartflow
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    networks:
      - smartflow-net
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/smartflow --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend ───────────────────────────────────────────────────
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: smartflow-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/smartflow
      NODE_ENV: production
      JWT_SECRET: smartflow_super_secret_key_2024
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - smartflow-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Frontend ──────────────────────────────────────────────────
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: smartflow-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - smartflow-net

volumes:
  mongo-data:
    driver: local

networks:
  smartflow-net:
    driver: bridge
